name: Daily Web Scraping to Google Drive

on:
  schedule:
    - cron: '0 2 * * *'  # Ogni giorno alle 02:00 UTC (04:00 italiane)
  workflow_dispatch:     # Avvio manuale

jobs:
  scrape_and_upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create Google credentials file
      run: |
        echo "${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}" > credentials.json

    - name: Run scraping script
      run: python filtra_aziende.py

    - name: Upload CSV to Google Drive
      run: python upload_to_drive.py
