name: Tracker Giornaliero eVoluto

on:
  schedule:
    - cron: '0 6 * * *'  # ogni giorno alle 6:00 UTC
  workflow_dispatch:     # puoi lanciarlo anche a mano

jobs:
  track-shortio:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tracker script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SHORTIO_API_KEY: ${{ secrets.SHORTIO_API_KEY }}
        SHORT_LINK_ID: ${{ secrets.SHORT_LINK_ID }}
      run: python shortio_tracker.py
